<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d35"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
    <marker id="arrowL" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#9fd3ff"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#f87171"/>
    </marker>
    <g id="gateBadge">
      <circle r="15" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
      <path d="M0,-8 L7,-5 L7,1 Q7,6 0,9 Q-7,6 -7,1 L-7,-5 Z" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
    <g id="warnBadge">
      <circle r="15" fill="#3b1111" stroke="#f87171" stroke-width="2"/>
      <line x1="0" y1="-7" x2="0" y2="3" stroke="#f87171" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="0" cy="8" r="1.7" fill="#f87171"/>
    </g>
  </defs>
  <rect width="400" height="470" fill="url(#bg)" rx="12"/>
  <text x="20" y="48" font-size="25" font-weight="700" fill="#ffffff">Identity is not</text>
  <text x="20" y="80" font-size="25" font-weight="700" fill="#ffffff">the only perimeter.</text>
  <text x="20" y="114" font-size="21" font-weight="700" fill="#9fd3ff">Every path needs a boundary.</text>

  <!-- Agent -->
  <rect x="20" y="160" width="120" height="236" rx="14" fill="#123a63" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="80" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Invoice</text>
  <text x="80" y="288" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">agent</text>
  <text x="80" y="312" text-anchor="middle" font-size="12" fill="#9fd3ff">own identity</text>

  <!-- Boundary around the approved targets -->
  <rect x="236" y="148" width="154" height="160" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#5eead4" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="313" y="326" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.2" fill="#5eead4">BOUNDARY</text>

  <line x1="140" y1="188" x2="246" y2="188" stroke="#9fd3ff" stroke-width="2" marker-end="url(#arrowL)"/>
  <rect x="250" y="160" width="130" height="56" rx="12" fill="#123a63" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="315" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Azure Storage</text>
  <use href="#gateBadge" x="193" y="188"/>

  <line x1="140" y1="268" x2="246" y2="268" stroke="#9fd3ff" stroke-width="2" marker-end="url(#arrowL)"/>
  <rect x="250" y="240" width="130" height="56" rx="12" fill="#123a63" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="315" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">MCP server</text>
  <text x="315" y="283" text-anchor="middle" font-size="11" fill="#9fd3ff">allowlisted</text>
  <use href="#gateBadge" x="193" y="268"/>

  <line x1="140" y1="368" x2="246" y2="368" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
  <rect x="250" y="340" width="130" height="56" rx="12" fill="#2a1620" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="315" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#fca5a5">Attacker</text>
  <text x="315" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#fca5a5">endpoint</text>
  <use href="#warnBadge" x="193" y="368"/>

  <text x="20" y="432" font-size="13" fill="#9fd3ff">Identity decides who may ask.</text>
  <text x="20" y="454" font-size="13" fill="#fca5a5">An allowed path can still carry the data out.</text>
</svg>
