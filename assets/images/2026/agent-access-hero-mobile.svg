<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d35"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="470" fill="url(#bg)"/>

  <text x="24" y="52" font-size="28" font-weight="700" fill="#ffffff">Who decides what</text>
  <text x="24" y="86" font-size="28" font-weight="700" fill="#9fd3ff">the agent can access?</text>

  <rect x="24" y="112" width="352" height="330" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#2f5d8a" stroke-width="1.5"/>
  <text x="40" y="136" font-size="11" font-weight="600" letter-spacing="1.2" fill="#9fd3ff">ORDER AGENT · ACCESS LAYERS</text>

  <g font-size="14">
    <rect x="40" y="146" width="320" height="30" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="166" font-weight="600" fill="#ffffff">Identity</text>
    <text x="348" y="166" text-anchor="end" fill="#9fd3ff">platform · owner</text>

    <rect x="40" y="182" width="320" height="30" rx="7" fill="#3b1111" stroke="#f87171" stroke-width="1.5"/>
    <text x="52" y="202" font-weight="600" fill="#ffffff">Permissions</text>
    <text x="348" y="202" text-anchor="end" fill="#fca5a5">widened · nobody</text>

    <rect x="40" y="218" width="320" height="30" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="238" font-weight="600" fill="#ffffff">Data scope</text>
    <text x="348" y="238" text-anchor="end" fill="#9fd3ff">data owner</text>

    <rect x="40" y="254" width="320" height="30" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="274" font-weight="600" fill="#ffffff">Tools</text>
    <text x="348" y="274" text-anchor="end" fill="#9fd3ff">builder</text>

    <rect x="40" y="290" width="320" height="30" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="310" font-weight="600" fill="#ffffff">Instructions</text>
    <text x="348" y="310" text-anchor="end" fill="#9fd3ff">builder</text>

    <rect x="40" y="326" width="320" height="30" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="346" font-weight="600" fill="#ffffff">Path</text>
    <text x="348" y="346" text-anchor="end" fill="#9fd3ff">platform</text>

    <rect x="40" y="362" width="320" height="30" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="382" font-weight="600" fill="#ffffff">Approval</text>
    <text x="348" y="382" text-anchor="end" fill="#9fd3ff">business sponsor</text>

    <rect x="40" y="398" width="320" height="30" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="418" font-weight="600" fill="#ffffff">Evidence</text>
    <text x="348" y="418" text-anchor="end" fill="#9fd3ff">platform</text>
  </g>

  <text x="24" y="460" font-size="12" fill="#fca5a5">The layer nobody owns is the one that drifts.</text>
</svg>
