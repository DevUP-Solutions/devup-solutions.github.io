<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d35"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="470" fill="url(#bg)"/>

  <text x="24" y="52" font-size="28" font-weight="700" fill="#ffffff">Who decides what</text>
  <text x="24" y="86" font-size="28" font-weight="700" fill="#9fd3ff">the agent can access?</text>

  <rect x="24" y="112" width="352" height="330" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#2f5d8a" stroke-width="1.5"/>
  <text x="40" y="136" font-size="11" font-weight="600" letter-spacing="1.2" fill="#9fd3ff">ORDER AGENT · ACCESS LAYERS</text>

  <g font-size="14">
    <rect x="40" y="148" width="320" height="34" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="170" font-weight="600" fill="#ffffff">Identity</text>
    <text x="348" y="170" text-anchor="end" fill="#9fd3ff">sponsor · owner</text>

    <rect x="40" y="188" width="320" height="34" rx="7" fill="#3b1111" stroke="#f87171" stroke-width="1.5"/>
    <text x="52" y="210" font-weight="600" fill="#ffffff">Permissions</text>
    <text x="348" y="210" text-anchor="end" fill="#fca5a5">widened · nobody</text>

    <rect x="40" y="228" width="320" height="34" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="250" font-weight="600" fill="#ffffff">Data scope</text>
    <text x="348" y="250" text-anchor="end" fill="#9fd3ff">data owner</text>

    <rect x="40" y="268" width="320" height="34" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="290" font-weight="600" fill="#ffffff">Tools</text>
    <text x="348" y="290" text-anchor="end" fill="#9fd3ff">builder</text>

    <rect x="40" y="308" width="320" height="34" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="330" font-weight="600" fill="#ffffff">Path</text>
    <text x="348" y="330" text-anchor="end" fill="#9fd3ff">platform</text>

    <rect x="40" y="348" width="320" height="34" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="370" font-weight="600" fill="#ffffff">Approval</text>
    <text x="348" y="370" text-anchor="end" fill="#9fd3ff">business sponsor</text>

    <rect x="40" y="388" width="320" height="34" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <text x="52" y="410" font-weight="600" fill="#ffffff">Evidence</text>
    <text x="348" y="410" text-anchor="end" fill="#9fd3ff">operations</text>
  </g>

  <text x="24" y="460" font-size="12" fill="#fca5a5">The widest permission sets the real access.</text>
</svg>
