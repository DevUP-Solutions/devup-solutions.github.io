<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d35"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
    <marker id="arrowL" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#9fd3ff"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#f87171"/>
    </marker>
    <g id="idBadge">
      <circle r="15" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
      <circle cx="-4" cy="0" r="4.2" fill="none" stroke="#0078d4" stroke-width="2.2"/>
      <line x1="0" y1="0" x2="9" y2="0" stroke="#0078d4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="5.5" y1="0" x2="5.5" y2="4" stroke="#0078d4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="9" y1="0" x2="9" y2="4" stroke="#0078d4" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g id="gateBadge">
      <circle r="15" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
      <path d="M0,-8 L7,-5 L7,1 Q7,6 0,9 Q-7,6 -7,1 L-7,-5 Z" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
    <g id="warnBadge">
      <circle r="15" fill="#3b1111" stroke="#f87171" stroke-width="2"/>
      <line x1="0" y1="-7" x2="0" y2="3" stroke="#f87171" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="0" cy="8" r="1.7" fill="#f87171"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="60" y="98" font-size="48" font-weight="700" fill="#ffffff">Identity is not the only perimeter.</text>
  <text x="60" y="156" font-size="48" font-weight="700" fill="#9fd3ff">Every path needs a boundary.</text>

  <!-- Boundary -->
  <rect x="500" y="214" width="460" height="362" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#5eead4" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="526" y="244" font-size="14" font-weight="600" letter-spacing="1.5" fill="#5eead4">NETWORK BOUNDARY</text>

  <!-- Agent -->
  <rect x="60" y="330" width="280" height="90" rx="14" fill="#123a63" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="200" y="370" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Invoice agent</text>
  <text x="200" y="394" text-anchor="middle" font-size="13.5" fill="#9fd3ff">own identity · sponsor · owner</text>

  <!-- Paths into the boundary -->
  <path d="M 340,375 L 420,375 L 556,302" fill="none" stroke="#9fd3ff" stroke-width="2" marker-end="url(#arrowL)"/>
  <path d="M 340,375 L 420,375 L 556,410" fill="none" stroke="#9fd3ff" stroke-width="2" marker-end="url(#arrowL)"/>
  <path d="M 340,375 L 420,375 L 556,518" fill="none" stroke="#9fd3ff" stroke-width="2" marker-end="url(#arrowL)"/>

  <!-- Targets -->
  <rect x="560" y="270" width="260" height="64" rx="12" fill="#123a63" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="690" y="308" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Azure Storage</text>
  <rect x="560" y="378" width="260" height="64" rx="12" fill="#123a63" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="690" y="405" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">MCP server</text>
  <text x="690" y="427" text-anchor="middle" font-size="12.5" fill="#9fd3ff">approved · allowlisted</text>
  <rect x="560" y="486" width="260" height="64" rx="12" fill="#123a63" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="690" y="524" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Logic App</text>

  <!-- The allowed path that still carries data out -->
  <line x1="820" y1="410" x2="986" y2="410" stroke="#f87171" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowR)"/>
  <rect x="990" y="378" width="150" height="64" rx="12" fill="#2a1620" stroke="#f87171" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1065" y="405" text-anchor="middle" font-size="15" font-weight="600" fill="#fca5a5">Attacker</text>
  <text x="1065" y="425" text-anchor="middle" font-size="15" font-weight="600" fill="#fca5a5">endpoint</text>

  <!-- Markers -->
  <use href="#idBadge" x="380" y="375"/>
  <use href="#gateBadge" x="500" y="332"/>
  <use href="#gateBadge" x="500" y="396"/>
  <use href="#gateBadge" x="500" y="459"/>
  <use href="#warnBadge" x="960" y="410"/>

  <text x="60" y="610" font-size="16" fill="#9fd3ff">Identity decides who may ask.</text>
  <text x="1140" y="610" text-anchor="end" font-size="16" fill="#fca5a5">An allowed path can still carry the data out.</text>
</svg>
