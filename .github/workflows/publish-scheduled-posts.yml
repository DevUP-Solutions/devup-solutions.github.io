name: Publish scheduled posts

# GitHub Pages only rebuilds the site on push, and Jekyll leaves out posts
# whose date is still in the future at build time. A post merged ahead of its
# date therefore stays hidden until something triggers a build.
#
# This workflow requests a Pages build twice every morning so a post dated
# 07:00 or 09:00 Swedish time is live shortly after, in both summer and
# winter time:
#   06:15 UTC = 08:15 CEST / 07:15 CET
#   08:15 UTC = 10:15 CEST / 09:15 CET
# It can also be run by hand from the Actions tab.

on:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request-build:
    name: Request a GitHub Pages build
    runs-on: ubuntu-latest
    steps:
      - name: Request build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            --jq '"Pages build " + .status'
